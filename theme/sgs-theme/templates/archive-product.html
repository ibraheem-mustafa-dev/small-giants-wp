<!-- ⛔ BLOCK-VALIDATION RULE, learned the hard way 2026-08-21. Every structural note in
     this template lives HERE, outside all block delimiters, and must stay here.
     WordPress splits a block's saved content into innerContent chunks with null
     placeholders for inner BLOCKS, then compares the non-null chunks against save().
     A raw HTML comment is not a placeholder, so it lands in those chunks. Put one
     inside a WooCommerce filter block and save() has nothing to match it; put it inside
     an sgs/container and it is worse, because that block's save() emits the EMPTY
     string. Both report "unexpected or invalid content". Relocating a comment from a
     WC block into its sgs/container parent does NOT fix it — it moves the failure.
     Filter groups render in order: active chips / price / flavour / size.
     Each WC filter block also carries the wrapper <div> its own save() emits; omitting
     that is the second half of the same validation failure.
     Results count + sort sit INSIDE product-collection deliberately:
     woocommerce/product-results-count declares usesContext ["queryId"], so it only
     knows WHICH query to count as a descendant of the collection. catalog-sorting
     needs no context but is kept alongside so the two read as one toolbar. That
     toolbar container is contentWidth "full" because it is a toolbar row, not a page
     content band — the default "normal" would inject a band element for no reason. -->
