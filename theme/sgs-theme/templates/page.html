<!-- WIDTH MODEL (2026-08-21). ONE cap per page, and it is ours.
     OUTER (maxWidth, default {} = no cap) paints full-bleed; INNER (contentWidth,
     default "normal" = 1200px) holds the content. That pairing IS the model.
     `<main>` is STRUCTURE, not content, so it says contentWidth:"full" and passes width
     through — each section inside then paints edge-to-edge and caps its own words. This
     is the shape archive-product.html already uses and which measured correct live.
     ⛔ Do NOT re-add wp:post-content {"layout":{"type":"constrained"}}. It applied a
     SECOND 1200px cap inside a container that already capped at 1200 — three stacked
     caps doing one job, and the source of the outer/content width confusion. -->
