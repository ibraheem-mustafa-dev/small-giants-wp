<!-- BYLINE SEPARATORS ARE CSS, NOT CONTENT (2026-08-23). They used to be three
     hardcoded sgs/text "·" blocks between the fields. Measured live: post-author
     renders NO ELEMENT AT ALL on these posts, so two separators ended up adjacent
     and the byline read "July 31, 2026 · · Uncategorized". A separator authored as
     content assumes its neighbour renders; when the neighbour is conditional, the
     separator is orphaned and nothing detects it.
     `.sgs-byline > * + *::before` puts the separator on the FOLLOWING sibling, so a
     field that renders nothing takes its separator with it. Self-healing by
     construction. ⛔ Do not reintroduce separator blocks as content. -->

     This heading always renders, which is what actually closes the skip. -->
