<!-- Theme override of WooCommerce's plugin-registered `product-search-results` template.
     Reason: WooCommerce's version renders each result as a generic product-image +
     post-title + price + button stack. This version renders sgs/product-card instead,
     matching archive-product.html.

     WooCommerce KEEPS ownership of the query, filtering, sorting and pagination —
     woocommerce/product-collection stays exactly as WooCommerce shipped it (inherit:true).
     Only the contents of product-template change. That is the supported extension point:
     core/query-pagination* and woocommerce/product-results-count read queryId + query from
     product-collection's context, so replacing the collection would break all of them.

     Converted to SGS conventions vs the plugin original:
       - core/group -> sgs/container (core/group is banned; block-replacements.json)
       - dropped layout:{"inherit":true,"type":"constrained"} on <main> per D725 —
         one cap per page and it is ours; <main> is contentWidth "full" and passes width
         through, sections cap their own content.

     BLOCK-VALIDATION RULE: every comment in this file stays OUTSIDE all block delimiters.
     A raw HTML comment is not a null placeholder, so inside a block's saved content it
     lands in the innerContent chunks and fails validation against save(). This cost a day
     on 404.html and single.html (D755 session). Do not move these comments inline. -->
