<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop · Muslims In Construction</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/css/mic.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#F3EEE4}</style>
</helmet>
<div class="mic" onPointerDown="{{tap}}" style="background: #F3EEE4; color: #0F1D1C">
<dc-import name="Gauge" hint-size="46px,100%"></dc-import>
<div style="position: sticky; top: 0; z-index: 60"><dc-import name="Header" active="shop" tone="light" basket="{{basket}}" hint-size="100%,81px"></dc-import></div>
<section data-sec="hero" data-label="Shop · Level 00" ref="{{rf}}" class="sec {{v.hero}} bp" style="padding: 64px 0 60px">
<div class="wrap row" style="justify-content: space-between; align-items: end; gap: 28px">
<div class="stack" style="gap: 20px"><span class="mono r" style="color: #024E4A">MIC shop · Merch and event tickets</span><h1 class="disp" style="font-size: clamp(64px, 10vw, 170px)"><span class="word" style="--i: 1">Wear</span> <span class="word" style="--i: 2">the</span><br><span class="word serif" style="--i: 3; color: #007F7C">network</span></h1></div>
<div class="row r" role="tablist" aria-label="Category" style="--i: 4; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button class="chip" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
</div>
</section>

<section data-sec="grid" data-label="Shop · Level 01 · Products" ref="{{rf}}" class="sec {{v.grid}}" style="padding: 30px 0 140px; background: linear-gradient(180deg, #F3EEE4, #E9E2D4)">
<div class="wrap g3" style="gap: 28px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<article class="press r stack" style="--i: {{p.i}}; gap: 16px">
<a href="{{p.href}}" class="archc" style="display: block; position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: {{p.tileBg}}">
<sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ true }}"><img class="zoom" src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{p.noImg}}" hint-placeholder-val="{{ false }}"><span class="bp-dark" style="position: absolute; inset: 0; display: grid; place-items: center"><img src="assets/img/mic-symbol-gold.png" alt="" style="width: 30%"><span class="mono" style="position: absolute; bottom: 18px; color: #A9C9C4; font-size: 12px">{{p.phNote}}</span></span></sc-if>
<span class="mono" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: {{p.chipBg}}; color: {{p.chipFg}}; padding: 6px 12px; border-radius: 999px; font-weight: 600; white-space: nowrap">{{p.chip}}</span>
</a>
<div class="row" style="justify-content: space-between; align-items: baseline"><a href="{{p.href}}" style="color: #0F1D1C; text-decoration: none; font-size: 21px; font-weight: 800">{{p.name}}</a><span class="disp" style="font-size: 36px; color: #024E4A">{{p.price}}</span></div>
<sc-if value="{{p.hasSw}}" hint-placeholder-val="{{ true }}"><div class="row" role="radiogroup" aria-label="Colour" style="gap: 8px"><sc-for list="{{p.sw}}" as="w" hint-placeholder-count="2"><button role="radio" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.pick}}" style="width: 44px; height: 44px; border-radius: 99px; border: 0; background: {{w.c}}; box-shadow: {{w.ring}}; cursor: pointer"></button></sc-for><span style="font-size: 14px; color: #46524F">{{p.colour}}</span></div></sc-if>
<sc-if value="{{p.isTicket}}" hint-placeholder-val="{{ false }}"><a class="btn btn-deep btn-block" href="gala-2026.html#interest">Register interest <span class="arr" aria-hidden="true">→</span></a></sc-if>
<sc-if value="{{p.isMerch}}" hint-placeholder-val="{{ true }}"><button class="btn btn-deep btn-block" onClick="{{add}}">Add to basket</button></sc-if>
</article>
</sc-for>
</div>
<div class="wrap" style="margin-top: 56px"><p class="mono r" style="margin: 0; color: #46524F">One basket for merch and event tickets · <a href="basket.html" style="color: #024E4A">View basket</a></p></div>
</section>

<dc-import name="Footer" hint-size="100%,760px"></dc-import>
<sc-if value="{{sparkA}}" hint-placeholder-val="{{ false }}"><svg class="spark" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><polygon points="50,4 63,37 96,50 63,63 50,96 37,63 4,50 37,37"></polygon></svg><svg class="spark spark2" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" fill="none" stroke="#D4A73C" stroke-width="2"></rect></svg></sc-if>
<sc-if value="{{sparkB}}" hint-placeholder-val="{{ false }}"><svg class="spark" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><polygon points="50,4 63,37 96,50 63,63 50,96 37,63 4,50 37,37"></polygon></svg><svg class="spark spark2" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" fill="none" stroke="#D4A73C" stroke-width="2"></rect></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 4400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const self = this;
    this.state = Object.assign({ v: {}, all: false, tap: 0, tx: 0, ty: 0, now: Date.now(), basket: 0 }, {"cat": "All", "col": {}});
    this.io = (typeof IntersectionObserver !== 'undefined') ? new IntersectionObserver(function (es) {
      const add = {};
      es.forEach(function (e) { if (e.isIntersecting) { add[e.target.getAttribute('data-sec')] = 1; self.io.unobserve(e.target); } });
      if (Object.keys(add).length) self.setState(function (s) { return { v: Object.assign({}, s.v, add) }; });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;
    this.rf = function (el) { if (el && self.io) self.io.observe(el); };
    this.tap = function (e) { const r = e.currentTarget.getBoundingClientRect(); self.setState({ tap: self.state.tap + 1, tx: Math.round(e.clientX - r.left), ty: Math.round(e.clientY - r.top) }); };
    this.rails = {};
    this.railRef = function (k) { if (!self['_rr' + k]) self['_rr' + k] = function (el) { if (el) self.rails[k] = el; }; return self['_rr' + k]; };
    this.scrollRail = function (k, d) { return function () { const el = self.rails[k]; if (el) el.scrollBy({ left: d * 380, behavior: 'smooth' }); }; };
    this.set = function (patch) { return function () { self.setState(typeof patch === 'function' ? patch(self.state) : patch); }; };
    this.toggle = function (key, id) { return function () { const o = Object.assign({}, self.state[key]); o[id] = !o[id]; const p = {}; p[key] = o; self.setState(p); }; };
    this.prevent = function (patch) { return function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState(patch); }; };
  }
  componentDidMount() {
    const self = this;
    if (this.io) { try { document.querySelectorAll('[data-sec]').forEach(function (el) { self.io.observe(el); }); } catch (e) {} }
    this.safety = setTimeout(function () { if (!Object.keys(self.state.v).length) self.setState({ all: true }); }, 2200);
    this.clock = setInterval(function () { self.setState({ now: Date.now() }); }, 30000);
  }
  componentWillUnmount() { clearTimeout(this.safety); clearInterval(this.clock); if (this.io) this.io.disconnect(); }
  renderVals() {
    const self = this, s = this.state;
    const v = {}; ["hero", "grid"].forEach(function (k) { v[k] = (s.all || s.v[k]) ? 'in' : ''; });
    const base = { v: v, rf: this.rf, tap: this.tap, tx: s.tx, ty: s.ty, sparkA: s.tap > 0 && s.tap % 2 === 1, sparkB: s.tap > 0 && s.tap % 2 === 0, basket: s.basket, add: function () { self.setState({ basket: self.state.basket + 1 }); } };
    const page = (function () {
const P = [
  { id: 'polo', cat: 'Clothing', name: 'MIC Polo Shirt', price: '£15.00', note: 'S to XXL', imgs: { White: 'assets/img/shop-polo-white.jpg', Black: 'assets/img/shop-polo-black.jpg' }, def: 'White' },
  { id: 'tee', cat: 'Clothing', name: 'MIC T-Shirt', price: '£12.99', note: 'S to XXL', imgs: { Black: 'assets/img/shop-tee-black.jpg', White: '' }, def: 'Black' },
  { id: 'cap', cat: 'Headwear', name: 'MIC Cap', price: '£9.99', note: 'One size', imgs: { White: 'assets/img/shop-cap-white.jpg', Black: '' }, def: 'White' },
  { id: 'gala27', cat: 'Event tickets', name: 'Gala & Awards 2027', price: 'TBC', ticket: true }
];
const col = s.col || {};
const items = P.filter(function (p) { return s.cat === 'All' || p.cat === s.cat; }).map(function (p, i) {
  if (p.ticket) return { i: i, name: p.name, price: p.price, href: 'gala-2026.html#interest', hasImg: false, noImg: true, img: '', alt: '', phNote: 'Tickets open in 2027', tileBg: '#041F1E', chip: 'Event ticket', chipBg: '#D4A73C', chipFg: '#1A1405', hasSw: false, sw: [], colour: '', isTicket: true, isMerch: false };
  const c = col[p.id] || p.def; const img = p.imgs[c];
  return { i: i, name: p.name, price: p.price, href: 'product.html', hasImg: !!img, noImg: !img, img: img, alt: c + ' ' + p.name, phNote: c + ' product photo from MIC', tileBg: '#E4E2DE', chip: p.note, chipBg: '#FBF8F2', chipFg: '#0F1D1C', hasSw: true, colour: c, isTicket: false, isMerch: true,
    sw: ['White', 'Black'].map(function (k) { const on = c === k; return { label: k, on: on ? 'true' : 'false', c: k === 'White' ? '#FFFFFF' : '#111111', ring: on ? '0 0 0 3px #F3EEE4, 0 0 0 5px #024E4A' : 'inset 0 0 0 1.5px rgba(2,78,74,.3)', pick: function () { const o = Object.assign({}, self.state.col); o[p.id] = k; self.setState({ col: o }); } }; }) };
});
return { cats: ['All', 'Clothing', 'Headwear', 'Event tickets'].map(function (c) { return { label: c, on: s.cat === c ? 'true' : 'false', pick: self.set({ cat: c }) }; }), items: items };

    }).call(this);
    return Object.assign(base, page);
  }
}
</script>
</body>
</html>
