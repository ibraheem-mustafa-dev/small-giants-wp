<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basket · Muslims In Construction</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/css/mic.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#F3EEE4}</style>
</helmet>
<div class="mic" onPointerDown="{{tap}}" style="background: #F3EEE4; color: #0F1D1C">
<dc-import name="Gauge" hint-size="46px,100%"></dc-import>
<div style="position: sticky; top: 0; z-index: 60"><dc-import name="Header" active="shop" tone="light" basket="{{basket}}" hint-size="100%,81px"></dc-import></div>
<section data-sec="bag" data-label="Basket" ref="{{rf}}" class="sec {{v.bag}} bp" style="padding: 56px 0 130px; min-height: 900px">
<div class="wrap stack" style="gap: 36px">
<div class="row" style="justify-content: space-between; align-items: end"><h1 class="disp r" style="font-size: clamp(60px, 8vw, 130px)">Your <span class="serif c-teal">basket</span></h1><span class="mono r" style="--i: 1; color: #46524F">{{countLabel}}</span></div>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<div class="g2" style="gap: 40px; align-items: start">
<ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(2,78,74,.2)">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<li class="r bag-li" style="--i: {{it.i}}; padding: 20px 0; border-bottom: 1px solid rgba(2,78,74,.2)">
<img src="{{it.img}}" alt="" style="width: 100%; aspect-ratio: 11 / 13; height: auto; object-fit: cover; border-radius: 999px 999px 12px 12px; background: #E4E2DE">
<div class="stack" style="gap: 6px; min-width: 0"><strong style="font-size: 19px">{{it.name}}</strong><span style="color: #46524F">{{it.opt}}</span>
<div class="row" style="gap: 4px; flex-wrap: nowrap"><button class="btn btn-sm" onClick="{{it.dec}}" aria-label="Decrease {{it.name}}" style="width: 40px; min-height: 40px; padding: 0; background: #E9E2D4; color: #0F1D1C">−</button><span class="disp" style="font-size: 24px; min-width: 28px; text-align: center">{{it.qty}}</span><button class="btn btn-sm" onClick="{{it.inc}}" aria-label="Increase {{it.name}}" style="width: 40px; min-height: 40px; padding: 0; background: #E9E2D4; color: #0F1D1C">+</button><button class="link" onClick="{{it.remove}}" style="margin-left: 14px; background: none; border: 0; color: #024E4A; cursor: pointer; font: 700 14px Manrope, sans-serif; min-height: 40px">Remove</button></div></div>
<span class="disp" style="font-size: 32px; color: #024E4A">{{it.line}}</span>
</li>
</sc-for>
</ul>
<aside class="r" style="--i: 2; background: #024E4A; color: #F3EBDD; border-radius: 28px; padding: 34px; display: flex; flex-direction: column; gap: 16px">
<span class="eyebrow" style="color: #D4A73C">Order summary</span>
<div class="row" style="justify-content: space-between; font-size: 17px"><span>Subtotal</span><strong>{{subtotal}}</strong></div>
<div class="row" style="justify-content: space-between; font-size: 15px; color: #A9C9C4"><span>Delivery</span><span>[From MIC]</span></div>
<sc-if value="{{noPromo}}" hint-placeholder-val="{{ true }}"><button class="link" onClick="{{showPromo}}" style="align-self: flex-start; background: none; border: 0; color: #D4A73C; font: 700 15px Manrope, sans-serif; cursor: pointer; padding: 6px 0">Add a promo code</button></sc-if>
<sc-if value="{{promo}}" hint-placeholder-val="{{ false }}"><div class="row rise" style="gap: 8px; flex-wrap: nowrap"><label for="promo" class="sr">Promo code</label><input id="promo" class="field field-d" type="text" placeholder="Promo code" style="border-radius: 999px"><button class="btn btn-ghost btn-sm">Apply</button></div></sc-if>
<div style="height: 1px; background: rgba(243,235,221,.2)"></div>
<div class="row" style="justify-content: space-between; font-size: 24px"><strong>Total</strong><strong class="disp" style="font-size: 44px; color: #D4A73C">{{subtotal}}</strong></div>
<a class="btn btn-gold btn-block" href="checkout.html">Checkout securely <span class="arr" aria-hidden="true">→</span></a>
<a class="btn btn-ghost btn-block" href="shop.html">Keep shopping</a>
<p class="mono" style="margin: 0; color: #A9C9C4; font-size: 12px">One basket for merch and event tickets</p>
</aside>
</div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div class="stack rise" style="align-items: center; text-align: center; gap: 20px; padding: 80px 0">
<svg class="bob" width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#024E4A" stroke-width="2.5"><rect x="20" y="20" width="60" height="60"></rect><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"></rect></g></svg>
<p class="serif" style="margin: 0; font-size: 44px">Nothing laid down yet.</p>
<a class="btn btn-deep" href="shop.html">Visit the shop <span class="arr" aria-hidden="true">→</span></a>
</div>
</sc-if>
</div>
</section>

<dc-import name="Footer" hint-size="100%,760px"></dc-import>
<sc-if value="{{sparkA}}" hint-placeholder-val="{{ false }}"><svg class="spark" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><polygon points="50,4 63,37 96,50 63,63 50,96 37,63 4,50 37,37"></polygon></svg><svg class="spark spark2" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" fill="none" stroke="#D4A73C" stroke-width="2"></rect></svg></sc-if>
<sc-if value="{{sparkB}}" hint-placeholder-val="{{ false }}"><svg class="spark" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><polygon points="50,4 63,37 96,50 63,63 50,96 37,63 4,50 37,37"></polygon></svg><svg class="spark spark2" viewBox="0 0 100 100" style="left: {{tx}}px; top: {{ty}}px" aria-hidden="true"><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" fill="none" stroke="#D4A73C" stroke-width="2"></rect></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const self = this;
    this.state = Object.assign({ v: {}, all: false, tap: 0, tx: 0, ty: 0, now: Date.now(), basket: 4 }, {"items": [{"id": "polo", "name": "MIC Polo Shirt", "opt": "White \u00b7 M", "price": 15.0, "qty": 1, "img": "assets/img/shop-polo-white.jpg"}, {"id": "tee", "name": "MIC T-Shirt", "opt": "Black \u00b7 L", "price": 12.99, "qty": 2, "img": "assets/img/shop-tee-black.jpg"}, {"id": "cap", "name": "MIC Cap", "opt": "White \u00b7 One size", "price": 9.99, "qty": 1, "img": "assets/img/shop-cap-white.jpg"}], "promo": false});
    this.io = (typeof IntersectionObserver !== 'undefined') ? new IntersectionObserver(function (es) {
      const add = {};
      es.forEach(function (e) { if (e.isIntersecting) { add[e.target.getAttribute('data-sec')] = 1; self.io.unobserve(e.target); } });
      if (Object.keys(add).length) self.setState(function (s) { return { v: Object.assign({}, s.v, add) }; });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;
    this.rf = function (el) { if (el && self.io) self.io.observe(el); };
    this.tap = function (e) { const r = e.currentTarget.getBoundingClientRect(); self.setState({ tap: self.state.tap + 1, tx: Math.round(e.clientX - r.left), ty: Math.round(e.clientY - r.top) }); };
    this.rails = {};
    this.railRef = function (k) { if (!self['_rr' + k]) self['_rr' + k] = function (el) { if (el) self.rails[k] = el; }; return self['_rr' + k]; };
    this.scrollRail = function (k, d) { return function () { const el = self.rails[k]; if (el) el.scrollBy({ left: d * 380, behavior: 'smooth' }); }; };
    this.set = function (patch) { return function () { self.setState(typeof patch === 'function' ? patch(self.state) : patch); }; };
    this.toggle = function (key, id) { return function () { const o = Object.assign({}, self.state[key]); o[id] = !o[id]; const p = {}; p[key] = o; self.setState(p); }; };
    this.prevent = function (patch) { return function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState(patch); }; };
  }
  componentDidMount() {
    const self = this;
    if (this.io) { try { document.querySelectorAll('[data-sec]').forEach(function (el) { self.io.observe(el); }); } catch (e) {} }
    this.safety = setTimeout(function () { if (!Object.keys(self.state.v).length) self.setState({ all: true }); }, 2200);
    this.clock = setInterval(function () { self.setState({ now: Date.now() }); }, 30000);
  }
  componentWillUnmount() { clearTimeout(this.safety); clearInterval(this.clock); if (this.io) this.io.disconnect(); }
  renderVals() {
    const self = this, s = this.state;
    const v = {}; ["bag"].forEach(function (k) { v[k] = (s.all || s.v[k]) ? 'in' : ''; });
    const base = { v: v, rf: this.rf, tap: this.tap, tx: s.tx, ty: s.ty, sparkA: s.tap > 0 && s.tap % 2 === 1, sparkB: s.tap > 0 && s.tap % 2 === 0, basket: s.basket, add: function () { self.setState({ basket: self.state.basket + 1 }); } };
    const page = (function () {
const items = s.items || [];
const upd = function (id, fn) { return function () { const next = self.state.items.map(function (x) { return x.id === id ? fn(Object.assign({}, x)) : x; }).filter(function (x) { return x.qty > 0; }); self.setState({ items: next, basket: next.reduce(function (a, x) { return a + x.qty; }, 0) }); }; };
const sub = items.reduce(function (a, x) { return a + x.price * x.qty; }, 0);
const n = items.reduce(function (a, x) { return a + x.qty; }, 0);
return {
  items: items.map(function (x, i) { return { i: i, name: x.name, opt: x.opt, img: x.img, qty: x.qty, line: '£' + (x.price * x.qty).toFixed(2), inc: upd(x.id, function (y) { y.qty++; return y; }), dec: upd(x.id, function (y) { y.qty--; return y; }), remove: upd(x.id, function (y) { y.qty = 0; return y; }) }; }),
  hasItems: items.length > 0, empty: items.length === 0, subtotal: '£' + sub.toFixed(2), countLabel: n + (n === 1 ? ' item' : ' items'),
  promo: s.promo, noPromo: !s.promo, showPromo: self.set({ promo: true })
};

    }).call(this);
    return Object.assign(base, page);
  }
}
</script>
</body>
</html>
