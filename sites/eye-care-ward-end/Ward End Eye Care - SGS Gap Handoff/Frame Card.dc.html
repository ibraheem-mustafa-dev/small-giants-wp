<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;background:#fff;border:1px solid #E6E1DA;display:flex;flex-direction:column;height:100%;transition:border-color .3s,box-shadow .4s,transform .4s" style-hover="border-color:#CFC7BB;box-shadow:0 18px 44px rgba(20,20,20,.09);transform:translateY(-4px)">
  <a href="#" onClick="{{ p.open }}" style="display:block;position:relative;aspect-ratio:1/1;background:#F3F0EB;overflow:hidden">
    <sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ true }}">
      <div role="img" aria-label="{{ p.alt }}" style="width:100%;height:100%;background-size:cover;background-position:center;background-image:url({{ p.img }});filter: {{ p.imgFilter }};transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .4s" style-hover="transform:scale(1.06)"></div>
    </sc-if>
    <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A39C90;text-align:center;padding:18px">
        <span style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase">Photo to come</span>
      </div>
    </sc-if>

    <span style="position:absolute;top:0;left:0;padding:12px 14px;font-family:'Playfair Display',serif;font-weight:500;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:#141414;background:linear-gradient(135deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.82) 62%,rgba(255,255,255,0) 100%);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.brand }}</span>

    <sc-if value="{{ p.showSave }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute;bottom:12px;left:12px;background:#141414;color:#FAF8F5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px">{{ p.saveLabel }}</span>
    </sc-if>
  </a>

  <button onClick="{{ p.toggleFav }}" aria-label="{{ p.favLabel }}" title="{{ p.favLabel }}" style="position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid #E0DAD1;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s,transform .2s" style-hover="background:#fff;transform:scale(1.08)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="{{ p.favFill }}" stroke="#141414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-9.6A3.9 3.9 0 0 1 12 7a3.9 3.9 0 0 1 7 3.4c0 5-7 9.6-7 9.6z"></path></svg>
  </button>

  <div style="padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <a href="#" onClick="{{ p.open }}" style="font-size:16px;line-height:1.25">{{ p.name }}</a>
      <sc-if value="{{ p.pol }}" hint-placeholder-val="{{ false }}">
        <span style="flex-shrink:0;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #D8D2C8;color:#5E584F;padding:4px 7px;white-space:nowrap">Polarised</span>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:8px;min-height:18px">
      <sc-if value="{{ p.hasRating }}" hint-placeholder-val="{{ true }}">
        <span style="color:var(--accInk,#6F6152);font-size:12px;letter-spacing:.12em">★★★★★</span>
        <span style="font-size:12px;color:#77716A">{{ p.ratingLabel }} ({{ p.revs }})</span>
      </sc-if>
      <sc-if value="{{ p.noRating }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:12px;color:#A39C90">No reviews yet</span>
      </sc-if>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:auto;padding-top:6px">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
        <span style="font-size:18px;font-weight:500">{{ p.priceLabel }}</span>
        <sc-if value="{{ p.showSave }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:13px;color:#77716A;text-decoration:line-through">{{ p.rrp }}</span>
        </sc-if>
      </div>
      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
        <sc-for list="{{ p.colsShown }}" as="c" hint-placeholder-count="3">
          <button onClick="{{ c.pick }}" aria-label="{{ c.name }}" title="{{ c.name }}" style="width:17px;height:17px;border-radius:50%;padding:0;background: {{ c.hex }};border:1px solid #D8D2C8;box-shadow: {{ c.ring }};transition:transform .2s" style-hover="transform:scale(1.25)"></button>
        </sc-for>
        <sc-if value="{{ p.colsMore }}" hint-placeholder-val="{{ false }}">
          <a href="#" onClick="{{ p.open }}" title="{{ p.colCount }}" style="font-size:11px;color:#5E584F;border:1px solid #D8D2C8;border-radius:999px;padding:2px 6px;line-height:1.3;white-space:nowrap">{{ p.colsMoreLabel }}</a>
        </sc-if>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:420},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FrameCardProduct&quot;}}"></script>
</body>
</html>
