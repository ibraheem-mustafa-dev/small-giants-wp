# The cloning route's non-browser test suite (scripts/computed-route/tests), split across parallel runners so merge batches are
# proven without local CPU. No secrets: the default read-only GITHUB_TOKEN only; nothing from .claude/secrets or any credential is
# in the checkout (gitignored) and the tests use fixture secrets in temp folders. File selection and sharding: tools/ci-shard.mjs
# (reuses tools/run-tests.mjs). Run a branch: node scripts/computed-route/tools/ci-route-tests.mjs <branch>.
name: route-tests

on:
  workflow_dispatch:
  push:
    branches: [ 'fix/**', 'main' ]

permissions:
  contents: read

concurrency:
  group: route-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        shard: [ 0, 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/computed-route/package-lock.json
            plugins/sgs-blocks/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
      - name: Install route packages
        working-directory: scripts/computed-route
        run: npm ci --ignore-scripts
      - name: Install plugin packages (scripts/wp-build-page.js loads Playwright from here)
        working-directory: plugins/sgs-blocks
        run: npm ci --ignore-scripts
      - name: Run shard
        working-directory: scripts/computed-route
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/ci-shard.mjs --run --index ${{ matrix.shard }} --count 6 --out "${{ runner.temp }}/out/${{ matrix.os }}-${{ matrix.shard }}"
      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  summary:
    name: summary
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/all
      - name: Per-file pass and fail
        run: node scripts/computed-route/tools/ci-summary.mjs "${{ runner.temp }}/all"
