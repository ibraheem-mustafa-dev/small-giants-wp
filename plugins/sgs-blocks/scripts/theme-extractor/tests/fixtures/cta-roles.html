<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CTA roles fixture</title>
<style>
  body { margin: 0; background: #fbf3dc; font-family: sans-serif; }
  section { padding: 40px; }
</style>
</head>
<body>
<section class="sgs-hero">
  <div>
    <a href="#build" style="display:inline-flex;align-items:center;height:60px;padding:0 30px;border-radius:999px;border:2px solid #3a2a22;background:#f9cf6e;color:#3a2a22;font-weight:700;font-size:17px;text-decoration:none">Build your box</a>
    <a href="#gifts" style="display:inline-flex;align-items:center;height:60px;padding:0 26px;border-radius:999px;border:2px solid #3a2a22;background:#fffaf0;color:#3a2a22;font-weight:700;font-size:17px;text-decoration:none">Send a gift</a>
  </div>
</section>
<section>
  <div>
    <button aria-pressed="true" style="min-height:48px;padding:0 18px;border-radius:999px;border:2px solid #3a2a22;background:#f9cf6e;color:#3a2a22;font-weight:700;font-size:16px">Milk chips</button>
    <button aria-pressed="false" style="min-height:48px;padding:0 18px;border-radius:999px;border:2px solid #3a2a22;background:#fffaf0;color:#3a2a22;font-weight:700;font-size:16px">Dark chips</button>
  </div>
  <button style="height:64px;border-radius:999px;border:2px solid #3a2a22;background:#f9cf6e;color:#3a2a22;font-weight:700;font-size:18px">Add to basket</button>
  <a href="https://example.com/reviews" target="_blank" rel="noopener" style="display:inline-flex;min-height:40px;padding:10px 22px;border-radius:20px;background:#1a73e8;color:#fff;font-size:14px">See all reviews</a>
</section>
</body>
</html>
