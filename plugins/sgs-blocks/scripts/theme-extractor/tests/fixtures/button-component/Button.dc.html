<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Button</title>
</helmet>
<div style="display:flex">
<sc-if value="{{ primaryLink }}"><a href="{{ href }}" style="height:{{ h }};padding:0 24px;border-radius:999px;border:2px solid #222222;color:#222222;font-weight:700;font-size:{{ fs }};box-shadow:4px 4px 0 #222222;transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, background .2s;background:#ffcc00;display:inline-flex;align-items:center;text-decoration:none" style-hover="background:#ffffff;transform:translate(-3px,-3px);box-shadow:7px 7px 0 #222222" style-active="transform:translate(3px,3px);box-shadow:0 0 0 #222222">{{ label }}</a></sc-if>
<sc-if value="{{ primaryButton }}"><button type="button" style="height:{{ h }};padding:0 24px;border-radius:999px;border:2px solid #222222;color:#222222;font-weight:700;font-size:{{ fs }};box-shadow:4px 4px 0 #222222;transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, background .2s;background:#ffcc00;display:inline-flex;align-items:center;text-decoration:none" style-hover="background:#ffffff;transform:translate(-3px,-3px);box-shadow:7px 7px 0 #222222" style-active="transform:translate(3px,3px);box-shadow:0 0 0 #222222">{{ label }}</button></sc-if>
<sc-if value="{{ secondaryLink }}"><a href="{{ href }}" style="height:{{ h }};padding:0 24px;border-radius:999px;border:2px solid #222222;color:#222222;font-weight:700;font-size:{{ fs }};box-shadow:4px 4px 0 #222222;transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, background .2s;background:#ffffff;display:inline-flex;align-items:center;text-decoration:none" style-hover="background:#ffcc00;transform:translate(-3px,-3px);box-shadow:7px 7px 0 #222222" style-active="transform:translate(3px,3px);box-shadow:0 0 0 #222222">{{ label }}</a></sc-if>
<sc-if value="{{ secondaryButton }}"><button type="button" style="height:{{ h }};padding:0 24px;border-radius:999px;border:2px solid #222222;color:#222222;font-weight:700;font-size:{{ fs }};box-shadow:4px 4px 0 #222222;transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, background .2s;background:#ffffff;display:inline-flex;align-items:center;text-decoration:none" style-hover="background:#ffcc00;transform:translate(-3px,-3px);box-shadow:7px 7px 0 #222222" style-active="transform:translate(3px,3px);box-shadow:0 0 0 #222222">{{ label }}</button></sc-if>
<sc-if value="{{ quietButton }}"><button type="button" style="height:{{ h }};padding:0 18px;border:0;background:#eeeeee;color:#222222;font-size:{{ fs }};font-weight:600;border-radius:6px" style-hover="background:#dddddd">{{ label }}</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;version&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;primary&quot;, &quot;secondary&quot;, &quot;quiet&quot;], &quot;default&quot;: &quot;primary&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
// A test button with three named versions and two sizes.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = p.version === 'secondary' || p.version === 'quiet' ? p.version : 'primary';
    const link = !!p.href, lg = p.size === 'lg';
    return { primaryLink: v === 'primary' && link, primaryButton: v === 'primary' && !link,
      secondaryLink: v === 'secondary' && link, secondaryButton: v === 'secondary' && !link, quietButton: v === 'quiet',
      label: p.label || null, href: p.href || null, h: lg ? '64px' : '56px', fs: lg ? '18px' : '17px' };
  }
}
</script>
</body>
</html>
