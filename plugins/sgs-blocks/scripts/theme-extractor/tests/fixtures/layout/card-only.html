<!doctype html>
<html><head><meta charset="utf-8"><title>Only a small card is capped</title>
<style>*{box-sizing:border-box} body{margin:0;font:16px/1.5 sans-serif} section{padding:48px 32px}
.card{max-width:420px;margin:0 auto;padding:24px;border:1px solid #ccc}
.wide-card{max-width:760px;margin:0 auto;padding:24px;border:1px solid #ccc}</style></head>
<body>
<main>
  <section><h2>A full-width heading</h2><div class="card"><h3>Card</h3><p>The only max-width is here.</p></div></section>
  <section><div class="card"><h3>A lone card</h3><p>It holds all of this band's text.</p></div></section>
  <section><h2>Heading beside a wider card</h2><div class="wide-card"><p>Wider than the floor, but the heading is not inside it.</p></div></section>
</main>
</body></html>
