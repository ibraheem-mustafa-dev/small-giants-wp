<!doctype html>
<html><head><meta charset="utf-8"><title>Two content widths</title>
<style>
*{box-sizing:border-box} body{margin:0;font:16px/1.5 sans-serif}
.site-header{padding:16px 0} .site-header__inner{max-width:1200px;margin:0 auto;padding:0 24px}
.band{max-width:1200px;margin:0 auto;padding:64px 40px}
.bleed{padding:64px 40px;background:#eee} .bleed__inner{max-width:1400px;margin:0 auto}
.lede{max-width:40ch}
.ticker{white-space:nowrap;overflow:hidden;background:#222;color:#fff}
</style></head>
<body>
<header class="site-header"><div class="site-header__inner"><nav><a href="#">Home</a> <a href="#">Shop</a></nav></div></header>
<main>
  <section class="band"><h1 class="lede">A heading held to a reading measure</h1><p>Normal-width band one.</p></section>
  <div class="ticker">Full-bleed strip with no content width at all</div>
  <section class="bleed"><div class="bleed__inner"><h2>Wide band one</h2><p>Held to the wide width.</p></div></section>
  <section class="band"><h2>Normal band two</h2><p>Text.</p></section>
  <section class="bleed"><div class="bleed__inner"><h2>Wide band two</h2><p>Also wide.</p></div></section>
  <section class="band"><h2>Normal band three</h2><p>Text.</p></section>
</main>
<footer><p>Footer text, uncapped</p></footer>
</body></html>
