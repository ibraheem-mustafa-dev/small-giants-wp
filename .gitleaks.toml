title = "SGS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Three shapes read as generic API keys to the entropy rule and are not secrets: a motion token reference such as token:distance.2xl (a theme token name), and a draft element record key such as TradeApplication/33 or Home>SiteHeader@7#0/18#0 (a component name and template position, written in skeleton and intake records), and a block item's `_key` holding a random UUID (gallery, card grid and other item sets write one per item so the editor can reorder them)."
regexes = ['''^(?:distance|duration|easing)\.[0-9][0-9a-z-]*$''', '''^[A-Z][A-Za-z0-9 ]*(?:>[A-Za-z0-9 ]+@[0-9]+(?:#[0-9]+)?)*/[0-9]+(?:#[0-9]+)?$''', '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']
