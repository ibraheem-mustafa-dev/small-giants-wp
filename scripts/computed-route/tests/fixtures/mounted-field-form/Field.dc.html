<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<x-dc>
<label>{{ label }}<sc-if value="{{ isInput }}"><input type="text" name="{{ name }}"></sc-if><sc-if value="{{ isText }}"><textarea name="{{ name }}"></textarea></sc-if></label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;version&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;],&quot;default&quot;:&quot;standard&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;},&quot;multiline&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { label: p.label || null, isText: !!p.multiline, isInput: !p.multiline, name: p.name || null };
  }
}
</script>
</body></html>
