<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<x-dc>
<nav>
  <a href="#/">Home</a>
  <a href="#/about">About</a>
  <a href="#/nope">Missing page</a>
  <a href="tel:0100">Call</a>
  <sc-for each="{{ nav }}" as="item"><a href="{{ item.href }}">{{ item.label }}</a></sc-for>
  <a href="{{ cta.link }}">Built at run time</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'home', w: window.innerWidth };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
    window.addEventListener('hashchange', () => this.setState({ page: this.parseHash() }));
  }
  parseHash() { const h = (window.location.hash || '').replace(/^#\/?/, ''); return this.pages[h] ? h : 'home'; }
  get pages() { return { home: {}, about: {}, 'our-story': {} }; }
  renderVals() {
    const w = this.state.w;
    const slug = this.state.slug;
    return {
      nav: [ { label: 'Story', href: '#/our-story' }, { label: 'About', href: '#/about' } ],
      cta: { link: '#/' + slug },
      isM: w < 768, isT: 1024 > w, wide: w >= 1260,
    };
  }
}
</script>
</body></html>
