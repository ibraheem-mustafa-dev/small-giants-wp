<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<x-dc>
<nav>
  <a href="#/apply">Apply</a>
  <sc-for each="{{ menu }}" as="m"><button onClick="{{ m.onClick }}">{{ m.label }}</button></sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'home', active: null };
  componentDidMount() {
    this._hash = () => { this.setState({ page: this.parseHash(), active: null }); };
    window.addEventListener('hashchange', this._hash);
  }
  parseHash() { const h = (window.location.hash || '').replace(/^#\/?/, ''); return this.pages[h] ? h : 'home'; }
  go(href) { this.setState({ page: href.replace(/^#\/?/, '') }); window.location.hash = href.replace(/^#/, ''); }
  get pages() {
    if (this._pages) return this._pages;
    this._pages = { home: {}, apply: {}, contact: {} };
    return this._pages;
  }
  renderVals() {
    const items = [ { label: 'Contact', href: '#/contact' }, { label: 'Home', href: '#/' } ];
    return { menu: items.map((mn) => ({ label: mn.label, onClick: () => { this.go(mn.href); } })) };
  }
}
</script>
</body></html>
