<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<script>
(function () {
  var port = new URLSearchParams(location.search).get('loopback');
  if (!port || window.__sandboxProbed) { return; }
  window.__sandboxProbed = true;
  fetch('http://127.0.0.1:' + port + '/loopback-probe').catch(function () {});
  try { new WebSocket('ws://127.0.0.1:' + port + '/socket-probe'); } catch (e) {}
})();
</script>
<style>
.sandbox-title { font-family: 'Montserrat', sans-serif; font-weight: 700; }
</style>
</helmet>
<main style="font-family:system-ui,sans-serif;padding:24px;color:#222">
  <h1 class="sandbox-title" style="margin:0;font-size:32px">{{ title }}</h1>
  <section style="margin-top:16px;display:flex;gap:16px;align-items:flex-start">
    <img data-sandbox="photo" alt="A plate of food" width="80" height="80" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=80&amp;h=80&amp;q=60&amp;auto=format&amp;fit=crop" style="display:block;border-radius:8px">
    <div data-sandbox="map-frame" style="width:240px;height:120px;border:1px solid #ccc">
      <iframe title="Location map" src="https://maps.google.com/maps?q=Birmingham&amp;z=12&amp;output=embed" style="width:100%;height:100%;border:0;display:block"></iframe>
    </div>
  </section>
  <ul style="padding-left:20px">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="2">
      <li style="margin:2px 0"><span>{{ item.label }}</span></li>
    </sc-for>
  </ul>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;600px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      title: 'Sandbox fixture',
      items: [ { label: 'One' }, { label: 'Two' } ],
    };
  }
}
</script>
</body>
</html>
