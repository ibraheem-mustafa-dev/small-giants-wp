<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:system-ui,sans-serif;color:#222222;background:#ffffff">
  <header style="position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#ffffff">
    <span style="font-weight:700;font-size:20px;color:#cc3333">Fixture Foods</span>
    <nav aria-label="Main" style="display:flex;gap:16px">
      <sc-for list="{{ nav }}" as="link"><a href="{{ link.href }}" style="color:#222222;text-decoration:none">{{ link.label }}</a></sc-for>
    </nav>
    <button type="button" aria-label="Menu" onClick="{{ toggleDrawer }}" style="min-width:44px;min-height:44px;border:0;background:#cc3333;color:#ffffff">Menu</button>
  </header>
  <sc-if value="{{ drawerVisible }}">
    <aside aria-label="Site menu" style="position:fixed;top:0;right:0;width:280px;height:100vh;padding:24px;background:#222222;color:#ffffff">
      <a href="#/" style="display:block;color:#ffffff">Home</a>
      <a href="#/about" style="display:block;color:#ffffff">About us</a>
    </aside>
  </sc-if>
  <main style="padding:24px">
    <sc-if value="{{ isHome }}">
      <section style="padding:24px 0">
        <h1 style="margin:0 0 12px;font-size:32px;color:#cc3333">Fresh food for busy kitchens</h1>
        <p style="margin:0">We deliver ingredients across the region every weekday.</p>
      </section>
      <section style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <sc-for list="{{ cards }}" as="card">
          <article style="padding:16px;background:#f4f4f4">
            <h2 style="margin:0 0 8px;font-size:20px">{{ card.title }}</h2>
            <p style="margin:0">{{ card.body }}</p>
          </article>
        </sc-for>
      </section>
    </sc-if>
    <sc-if value="{{ isAbout }}">
      <section style="padding:24px 0">
        <h1 style="margin:0 0 12px;font-size:32px">About us</h1>
        <p style="margin:0">Family run since 1962.</p>
      </section>
    </sc-if>
  </main>
  <footer style="padding:24px;background:#222222;color:#ffffff">
    <p style="margin:0">Call <a href="tel:01217714330" style="color:#ffffff">0121 771 4330</a> or email <a href="mailto:hello@fixturefoods.co.uk" style="color:#ffffff">hello@fixturefoods.co.uk</a></p>
    <p style="margin:0">12 High Street, Birmingham B1 1AA</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;600px&quot;}}">
class Component extends DCLogic {
  state = { page: 'home', w: window.innerWidth, drawerOpen: false };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
    window.addEventListener('hashchange', () => this.setState({ page: this.parseHash(), drawerOpen: false }));
    this.setState({ page: this.parseHash() });
  }
  parseHash() { const h = (window.location.hash || '').replace(/^#\/?/, ''); return this.pages[h] ? h : 'home'; }
  get pages() { return { home: { title: 'Home' }, about: { title: 'About us' } }; }
  go(href) { window.location.hash = href; }
  toggleDrawer = () => { this.setState({ drawerOpen: !this.state.drawerOpen }); };
  renderVals() {
    const w = this.state.w;
    return {
      nav: [ { label: 'Home', href: '#/' }, { label: 'About', href: '#/about' } ],
      cards: [
        { title: 'Kitchens', body: 'Lorem ipsum dolor sit amet.' },
        { title: 'Retail', body: 'Lorem ipsum dolor sit amet.' },
        { title: 'Wholesale', body: 'Lorem ipsum dolor sit amet.' },
      ],
      drawerVisible: w < 1024 && this.state.drawerOpen,
      isHome: 'home' === this.state.page,
      isAbout: 'about' === this.state.page,
      toggleDrawer: this.toggleDrawer,
    };
  }
}
</script>
</body>
</html>
