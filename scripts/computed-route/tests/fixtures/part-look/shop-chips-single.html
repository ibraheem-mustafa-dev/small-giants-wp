<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chips</title></head>
<body>
<div id="dc-root"><main>
<div id="r" role="group" style="display:flex;gap:10px">
<button aria-pressed="true" style="min-height:46px;padding:0 18px;border:2px solid #3a2a22;border-radius:999px">All<span style="min-width:22px;height:22px">9</span></button>
<button aria-pressed="false" style="min-height:46px;padding:0 18px;border:2px solid #3a2a22;border-radius:999px">Zookies<span style="min-width:22px;height:22px">4</span></button>
<button aria-pressed="false" style="min-height:46px;padding:0 18px;border:2px solid #3a2a22;border-radius:999px">Gifts<span style="min-width:22px;height:22px">3</span></button>
<button aria-pressed="false" style="min-height:46px;padding:0 18px;border:2px solid #3a2a22;border-radius:999px">Bundles<span style="min-width:22px;height:22px">2</span></button>
</div>
</main></div>
<script>
document.querySelectorAll( '#r button' ).forEach( ( b ) => b.addEventListener( 'click', () => {
	document.querySelectorAll( '#r button' ).forEach( ( o ) => o.setAttribute( 'aria-pressed', String( o === b ) ) );
} ) );
</script>
</body>
</html>
