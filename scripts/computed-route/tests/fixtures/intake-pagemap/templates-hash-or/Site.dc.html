<!doctype html>
<html><head><meta charset="utf-8"><title>Studio</title></head><body>
<x-dc>
<header><a href="#/">Studio</a><nav><a href="#/about">About</a></nav></header>
<main><h1>{{ title }}</h1></main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'home' };
  componentDidMount() { window.addEventListener('hashchange', () => this.setState({ page: this.parseHash() })); }
  parseHash() { return (window.location.hash || '').replace(/^#\/?/, '') || 'home'; }
  get pages() {
    return { home: { title: 'Welcome' }, about: { title: 'About us' }, gone: { title: 'Gone' } };
  }
  renderVals() {
    const pages = this.pages;
    const page = pages[this.state.page] || pages.gone;
    return { title: page.title };
  }
}
</script>
</body></html>
