<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="application/json" data-sgs-manifest>

  { "id": "home", "label": "Home", "kind": "front page", "wp": { "slug": "home", "parent": null, "type": "page" } },

<x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'home' };
  go(p) { this.setState({ page: p }); }
  renderVals() {
    return { toShop: () => this.go('shop'), toAccount: () => this.go('account'), toHome: () => this.go('home'), toSignin: () => this.go('signin') };
  }
}
