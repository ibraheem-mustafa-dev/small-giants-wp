<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<x-dc>
<div><p>{{ name }}</p><p>{{ price }}</p><button onClick="{{ add }}">Add</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { items: [] };
  renderVals() {
    return { name: 'Loaf', price: '£' + (4).toFixed(2), add: () => this.setState( ( s ) => ( { items: [ ...s.items, { name: 'Loaf' } ] } ) ) };
  }
}
</script>
</body></html>
