<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout | Bakery</title></head><body>
<x-dc>
<header><a href="Home.dc.html">Bakery</a><p>Secure checkout</p></header>
<main><sc-for list="{{ lines }}" as="l"><p>{{ l.name }} {{ l.price }}</p></sc-for><form onSubmit="{{ pay }}"><input name="card" autocomplete="cc-number"><button>Pay</button></form></main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { lines: [ { name: 'Loaf', price: '£' + (4).toFixed(2) } ], pay: ( e ) => { e.preventDefault(); location.href = "Confirmation.dc.html"; } }; }
}
</script>
</body></html>
