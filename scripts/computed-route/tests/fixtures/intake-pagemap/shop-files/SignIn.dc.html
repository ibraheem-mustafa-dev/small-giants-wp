<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in | Bakery</title></head><body>
<x-dc>
<dc-import name="SiteHeader"></dc-import>
<main>
  <form onSubmit="{{ doSignin }}"><input type="email" name="email"><input type="password" name="pw"><button>Sign in</button></form>
  <form onSubmit="{{ doRegister }}"><input type="email" name="email"><input type="password" name="pw"><button>Create account</button></form>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { doSignin: ( e ) => { e.preventDefault(); location.href = "Account.dc.html"; }, doRegister: ( e ) => e.preventDefault() }; }
}
</script>
</body></html>
