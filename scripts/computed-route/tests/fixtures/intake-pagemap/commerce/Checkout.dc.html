<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout | Bakery</title></head><body>
<x-dc>
<dc-import name="SiteHeader"></dc-import>
<main><sc-for list="{{ lines }}" as="l"><p>{{ l.name }} {{ l.price }}</p></sc-for>
<form onSubmit="{{ pay }}"><input name="card" inputmode="numeric"><input name="cvc" inputmode="numeric"><input name="phone" type="tel">
  <label><input type="checkbox" required> I agree to the <a href="Terms.dc.html">terms</a></label><button>Pay</button></form></main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { lines: [ { name: 'Loaf', price: '£' + (4).toFixed(2) } ], pay: ( e ) => { e.preventDefault(); location.href = 'Done.dc.html'; } }; }
}
</script>
</body></html>
