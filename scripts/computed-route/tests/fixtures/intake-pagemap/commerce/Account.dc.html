<!doctype html>
<html><head><meta charset="utf-8"><title>Your orders | Bakery</title></head><body>
<x-dc>
<dc-import name="SiteHeader"></dc-import>
<main><h1>Your orders</h1><form onSubmit="{{ save }}"><input type="password" name="pw"><button>Save</button></form><sc-for list="{{ orders }}" as="o"><p>{{ o.name }} {{ o.price }}</p></sc-for><a href="Checkout.dc.html">Buy again</a></main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { save: ( e ) => e.preventDefault(), orders: [ { name: "Loaf", price: "£" + (4).toFixed(2) } ] }; }
}
</script>
</body></html>
