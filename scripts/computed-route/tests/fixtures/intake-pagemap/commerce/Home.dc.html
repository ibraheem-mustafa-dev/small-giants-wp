<!doctype html>
<html><head><meta charset="utf-8"><title>Home | Bakery</title></head><body>
<x-dc>
<dc-import name="SiteHeader"></dc-import>
<main><h1>Fresh every day</h1><a href="Range.dc.html">Browse</a><a href="Locator.dc.html">Find us</a>
<sc-for list="{{ featured }}" as="p"><dc-import name="ProductCard"></dc-import></sc-for>
<section><h2>Pick a box</h2>
  <sc-for list="{{ bases }}" as="$o"><button onClick="{{ $o.pick }}" aria-pressed="{{ $o.on }}">{{ $o.label }}</button></sc-for>
  <sc-for list="{{ sizes }}" as="$o"><button onClick="{{ $o.pick }}" aria-pressed="{{ $o.on }}">{{ $o.label }}</button></sc-for>
</section></main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { base: 0, size: 0 };
  renderVals() {
    const S = this.state;
    return {
      featured: [ { name: 'Loaf', season: 'spring' }, { name: 'Bun', season: 'autumn' } ].filter( ( p ) => ! S.season || p.season === S.season ),
      bases: [ 'Oat', 'Spelt' ].map( ( label, i ) => ( { label, on: S.base === i, pick: () => this.setState( { base: i } ) } ) ),
      sizes: [ '6', '12' ].map( ( label, i ) => ( { label, on: S.size === i, pick: () => this.setState( { size: i } ) } ) ),
    };
  }
}
</script>
</body></html>
